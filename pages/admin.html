<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/static/favicon.ico">
<title>管理者ページ｜阿蘇リゾートグランヴィリオホテル　喫食時間管理表</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="/static/common.css">
<style>
  .section{margin-bottom:28px;max-width:900px}
  .section h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .section h2 .btn{margin-left:auto}
  .tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:#f0e6fb;color:#6a3fa0}
  .tag.off{background:#eee;color:#888}
  .tag.front{background:#e3effc;color:#185fa5}
  .tag.restaurant{background:#fdf0e1;color:#a55a00}
  .tag.developer{background:#263238;color:#fff}
  tr.inactive td{color:#aaa}
</style>
</head>
<body>
<div class="pageHead"><h1>管理者ページ</h1></div>

<section class="section">
  <h2><i class="ti ti-users"></i>ユーザー管理<button class="btn primary" id="addUser"><i class="ti ti-user-plus"></i>ユーザー追加</button></h2>
  <div class="tableWrap"><table class="grid">
    <thead><tr><th>ログインID</th><th>表示名</th><th>ロール</th><th>状態</th><th></th></tr></thead>
    <tbody id="userBody"><tr><td colspan="5" class="empty">読み込み中…</td></tr></tbody>
  </table></div>
</section>

<script src="/static/common.js"></script>
<script>
(function () {
  const { esc, api, toast, modal } = AMT;
  const ROLES = { developer: 'developer', admin: '管理者', front: 'フロント', restaurant: 'レストラン' };
  let meRole = null;
  // developer のアカウントは developer のみ作成・編集できる(サーバー側でも制限)
  const selectableRoles = () => Object.entries(ROLES).filter(([k]) => k !== 'developer' || meRole === 'developer');
  let users = [];
  let meId = null;

  // ---------- ユーザー ----------
  async function loadUsers() {
    users = await api('/api/users');
    document.getElementById('userBody').innerHTML = users.map(u => `
      <tr class="${u.active ? '' : 'inactive'}">
        <td>${esc(u.username)}</td>
        <td>${esc(u.display_name)}${u.id === meId ? ' <span class="muted">(自分)</span>' : ''}</td>
        <td><span class="tag ${u.role}">${ROLES[u.role] || esc(u.role)}</span></td>
        <td>${u.active ? '有効' : '<span class="tag off">無効</span>'}</td>
        <td style="text-align:right">${u.role === 'developer' && meRole !== 'developer' ? ''
          : `<button class="btn" data-edit="${u.id}"><i class="ti ti-pencil"></i>編集</button>`}</td>
      </tr>`).join('');
  }

  function userForm(u) {
    const isNew = !u;
    const self = u && u.id === meId;
    const m = modal({
      title: isNew ? 'ユーザー追加' : `ユーザー編集(${u.username})`,
      body: `<form class="form">
        ${isNew ? `<label>ログインID(半角英数字・記号 _ . -)<input type="text" name="username" required pattern="[A-Za-z0-9_.\\-]{2,64}" autocapitalize="off"></label>` : ''}
        <label>表示名<input type="text" name="display_name" required maxlength="64" value="${esc(u ? u.display_name : '')}"></label>
        <label>${isNew ? 'パスワード(4文字以上)' : '新しいパスワード(変更する場合のみ・4文字以上)'}
          <input type="password" name="password" minlength="4" ${isNew ? 'required' : ''} autocomplete="new-password"></label>
        <label>ロール<select name="role" ${self ? 'disabled' : ''}>
          ${selectableRoles().map(([k, v]) => `<option value="${k}"${(u ? u.role : 'front') === k ? ' selected' : ''}>${v}</option>`).join('')}
        </select></label>
        <p class="muted" style="margin:-6px 0 0;font-size:12px">管理者のみ管理者ページを利用できます。フロント・レストランは管理表とチャットを利用できます。</p>
        ${isNew ? '' : `<label class="check"><input type="checkbox" name="active" ${u.active ? 'checked' : ''} ${self ? 'disabled' : ''}>有効(外すとログインできなくなります)</label>`}
      </form>`,
      buttons: [{ label: 'キャンセル' }, {
        label: isNew ? '追加する' : '保存する', primary: true, onClick: async () => {
          const f = m.querySelector('form');
          if (!f.reportValidity()) return false;
          const body = { display_name: f.display_name.value, role: f.role.value };
          if (isNew) {
            body.username = f.username.value.trim();
            body.password = f.password.value;
            await api('/api/users', { method: 'POST', body });
          } else {
            if (f.password.value) body.password = f.password.value;
            if (!self) body.active = f.active.checked;
            else delete body.role;
            await api(`/api/users/${u.id}`, { method: 'PUT', body });
          }
          toast(isNew ? 'ユーザーを追加しました' : '保存しました');
          await loadUsers();
        }
      }]
    });
  }

  document.getElementById('addUser').addEventListener('click', () => userForm(null));
  document.getElementById('userBody').addEventListener('click', e => {
    const id = e.target.closest('[data-edit]')?.dataset.edit;
    if (id) userForm(users.find(u => u.id === +id));
  });

  AMT.me.then(me => { meId = me.id; meRole = me.role; return loadUsers(); }).catch(() => {});
})();
</script>
</body>
</html>
